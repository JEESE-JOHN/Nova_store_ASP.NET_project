<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Cheerful Playful Studio Backdrop -->
    <radialGradient id="bg-grad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="60%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </radialGradient>

    <!-- Wood Grain Gradients -->
    <linearGradient id="block-coral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <linearGradient id="block-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>

    <linearGradient id="block-yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <linearGradient id="block-wood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <linearGradient id="block-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>

    <filter id="toy-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="15" flood-color="#7c2d12" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg-grad)"/>

  <!-- Toy Castle Block Structure -->
  <g filter="url(#toy-shadow)">
    <!-- Base Board -->
    <rect x="180" y="470" width="440" height="25" rx="8" fill="url(#block-wood)"/>

    <!-- Bottom Layer Blocks -->
    <!-- Left Base Cube (Coral) -->
    <rect x="220" y="340" width="110" height="130" rx="12" fill="url(#block-coral)"/>
    <circle cx="275" cy="405" r="22" fill="#fff1f2"/>

    <!-- Middle Gateway Arch Block (Wood) -->
    <path d="M 345,340 H 455 V 470 H 425 V 400 C 425,380 375,380 375,400 V 470 H 345 Z" fill="url(#block-wood)"/>

    <!-- Right Base Cube (Teal) -->
    <rect x="470" y="340" width="110" height="130" rx="12" fill="url(#block-teal)"/>
    <rect x="495" y="365" width="60" height="80" rx="8" fill="#ccfbf1"/>

    <!-- Second Layer Blocks -->
    <!-- Long Horizontal Beam Block (Indigo) -->
    <rect x="200" y="290" width="400" height="50" rx="10" fill="url(#block-indigo)"/>

    <!-- Third Layer Cylinders & Triangle Roofs -->
    <!-- Left Pillar Cylinder (Yellow) -->
    <rect x="240" y="170" width="60" height="120" rx="10" fill="url(#block-yellow)"/>
    
    <!-- Middle Tower Block (Teal) -->
    <rect x="350" y="150" width="100" height="140" rx="10" fill="url(#block-teal)"/>
    <circle cx="400" cy="200" r="18" fill="#e0f2fe"/>

    <!-- Right Pillar Cylinder (Coral) -->
    <rect x="500" y="170" width="60" height="120" rx="10" fill="url(#block-coral)"/>

    <!-- Top Roof Pyramids -->
    <!-- Left Roof (Teal) -->
    <polygon points="270,90 220,170 320,170" fill="url(#block-teal)"/>

    <!-- Main Center Spire Roof (Yellow) -->
    <polygon points="400,50 330,150 470,150" fill="url(#block-yellow)"/>

    <!-- Right Roof (Indigo) -->
    <polygon points="530,90 480,170 580,170" fill="url(#block-indigo)"/>

    <!-- Loose Playful Blocks Standing Nearby -->
    <rect x="130" y="420" width="40" height="70" rx="8" transform="rotate(-15 130 420)" fill="url(#block-yellow)"/>
    <polygon points="630,410 600,470 660,470" fill="url(#block-coral)"/>
  </g>
</svg>
