<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Metallic Titanium Body Gradient -->
    <linearGradient id="frame-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="25%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="75%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Screen Abstract Wallpaper -->
    <linearGradient id="screen-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="35%" stop-color="#7c3aed"/>
      <stop offset="70%" stop-color="#db2777"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Wallpaper Mesh Glow -->
    <radialGradient id="wallpaper-glow" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Screen Glass Glare -->
    <linearGradient id="screen-glare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="phone-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="30" stdDeviation="25" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg-grad)"/>

  <!-- Phone Container with 3D Drop Shadow -->
  <g filter="url(#phone-shadow)">
    <!-- Outer Titanium Body Outer Bezel -->
    <rect x="260" y="40" width="280" height="520" rx="46" fill="url(#frame-grad)"/>
    
    <!-- Inner Dark Bezel Rim -->
    <rect x="264" y="44" width="272" height="512" rx="42" fill="#020617"/>

    <!-- OLED Screen Area -->
    <rect x="268" y="48" width="264" height="504" rx="38" fill="url(#screen-grad)"/>
    <rect x="268" y="48" width="264" height="504" rx="38" fill="url(#wallpaper-glow)"/>

    <!-- Dynamic Island / Punch Hole Camera -->
    <rect x="360" y="62" width="80" height="24" rx="12" fill="#000000"/>
    <circle cx="376" cy="74" r="5" fill="#0f172a"/>
    <circle cx="376" cy="74" r="2.5" fill="#1e293b"/>
    <circle cx="424" cy="74" r="4" fill="#020617"/>

    <!-- On-screen UI Widgets / Clock -->
    <!-- Time Text -->
    <text x="400" y="150" font-family="Inter, sans-serif" font-size="54" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-1">09:41</text>
    <text x="400" y="175" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#e0e7ff" text-anchor="middle">Tuesday, August 11</text>

    <!-- Abstract Glass Cards on Screen -->
    <rect x="288" y="220" width="224" height="90" rx="20" fill="rgba(255, 255, 255, 0.15)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5"/>
    <circle cx="320" cy="265" r="22" fill="rgba(255, 255, 255, 0.2)"/>
    <rect x="355" y="250" width="130" height="12" rx="6" fill="#ffffff"/>
    <rect x="355" y="270" width="90" height="8" rx="4" fill="rgba(255, 255, 255, 0.6)"/>

    <rect x="288" y="325" width="105" height="105" rx="20" fill="rgba(255, 255, 255, 0.15)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5"/>
    <circle cx="340" cy="377" r="26" fill="#38bdf8"/>

    <rect x="407" y="325" width="105" height="105" rx="20" fill="rgba(255, 255, 255, 0.15)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5"/>
    <rect x="427" y="355" width="65" height="10" rx="5" fill="#f43f5e"/>
    <rect x="427" y="375" width="45" height="8" rx="4" fill="#ffffff"/>

    <!-- Bottom Dock Bar -->
    <rect x="288" y="470" width="224" height="60" rx="30" fill="rgba(255, 255, 255, 0.2)" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1.5"/>
    <circle cx="320" cy="500" r="18" fill="#22c55e"/>
    <circle cx="373" cy="500" r="18" fill="#3b82f6"/>
    <circle cx="426" cy="500" r="18" fill="#ec4899"/>
    <circle cx="479" cy="500" r="18" fill="#f59e0b"/>

    <!-- Home Indicator Bar -->
    <rect x="350" y="542" width="100" height="5" rx="2.5" fill="#ffffff"/>

    <!-- Glass Reflection Layer -->
    <rect x="268" y="48" width="264" height="504" rx="38" fill="url(#screen-glare)"/>
  </g>
</svg>
